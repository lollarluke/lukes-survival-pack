# Distant Horizons client defaults for Luke's Survival Pack (applied on first install only, via Default Options).
# Explicit values: DH does not expand the LOW/LOW_IMPACT preset labels on its own, so the presets are CUSTOM.
# DH fills in every other setting on first launch. Players can raise anything in the DH menu.
_version = 5

[client]
	quickEnableRendering = true
	qualityPresetSetting = "CUSTOM"
	threadPresetSetting = "CUSTOM"

	[client.advanced.autoUpdater]
		# Never let DH swap its own jar: every player must stay on the pack's version.
		enableAutoUpdater = false
		enableSilentUpdates = false

	[client.advanced.graphics]
		# SSAO costs a lot of GPU for little gain on distant terrain.
		enableSsao = false

	[client.advanced.graphics.quality]
		# 128 chunks (2,048 blocks) of LODs instead of 256.
		lodChunkRenderDistanceRadius = 128
		#Was 4 (DH default). Each step adds LOD detail while zoomed (Ok Zoomer, spyglass): more memory and GPU.
		maxZoomQualityIncrease = 2
		maxHorizontalResolution = "TWO_BLOCKS"
		verticalQuality = "LOW"
		horizontalQuality = "LOW"
		lodBiomeBlending = 1
		vanillaFadeMode = "SINGLE_PASS"

	[client.advanced.graphics.genericRendering]
		enableMultiLayerClouds = false

[common]

	[common.multiThreading]
		numberOfThreads = 2
		threadRunTimeRatio = "0.75"
